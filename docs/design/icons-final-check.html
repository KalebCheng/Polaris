<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#f6f7fb;font:12px -apple-system,"PingFang SC",sans-serif;margin:0;padding:20px;color:#26262f}
h3{font-size:13px;margin:6px 0 12px;font-weight:600}
.row{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid #e7e7ef;border-radius:12px;padding:14px 18px;margin-bottom:14px}
.row.dark{background:#1f2033;border-color:#2b2c43;color:#eeeef7}
figure{margin:0;text-align:center}figcaption{font-size:10px;color:#6b6b7b;margin-top:6px}
.dark figcaption{color:#a9a9c4}
.tile{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:26%;background:#fff;box-shadow:inset 0 0 0 1px rgba(20,20,40,.1)}
.row.dark .tile{background:#2b2c43}
.small{width:24px;height:24px}
img,svg{display:block}
</style></head><body>
<h3>目录/实例卡片 · 40px 中性基底（浅色）</h3>
<div class="row">
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/dingtalk.png" width="32"></span><figcaption>钉钉</figcaption></figure>
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/wecom.png" width="34"></span><figcaption>企业微信</figcaption></figure>
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/feishu.png" width="34"></span><figcaption>飞书 / Lark</figcaption></figure>
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/ad.png" width="30"></span><figcaption>AD 域控</figcaption></figure>
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/openldap.png" width="34"></span><figcaption>OpenLDAP</figcaption></figure>
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/mysql.svg" width="30"></span><figcaption>数据库 · MySQL</figcaption></figure>
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/postgres.png" width="30"></span><figcaption>数据库 · PostgreSQL</figcaption></figure>
  <figure><span class="tile"><img src="../../frontend/web/public/icons/connections/oidc.png" width="34"></span><figcaption>OIDC</figcaption></figure>
  <figure><span class="tile"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#64748b" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="5.4"/><path d="M12 6.6c1.7 1.6 2.6 3.4 2.6 5.4s-.9 3.8-2.6 5.4c-1.7-1.6-2.6-3.4-2.6-5.4s.9-3.8 2.6-5.4z"/><path d="M6.9 10.4h10.2M6.9 13.6h10.2"/></svg></span><figcaption>通用 HTTP（兜底矢量）</figcaption></figure>
</div>

<div class="row">
  <figure><span class="tile small"><img src="../../frontend/web/public/icons/connections/dingtalk.png" width="20"></span><figcaption>24</figcaption></figure>

</body></html>
