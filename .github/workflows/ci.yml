name: CI

# Reusable test workflow; runs on pull requests, Release calls, and manual dispatch.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（vet + 单元测试）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: gofmt
        run: test -z "$(gofmt -l cmd internal pkg)"

      - name: 单元测试
        run: go test -race ./...

  repository-integration:
    name: 后端（PostgreSQL 迁移与仓库集成）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris-ci-password
          POSTGRES_DB: polaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polaris -d polaris_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: 迁移与仓库集成测试
        env:
          POLARIS_TEST_DATABASE_URL: postgres://polaris:polaris-ci-password@127.0.0.1:5432/polaris_test?sslmode=disable
        run: go test ./internal/repository/postgres -count=1

      # 不在 CI 里重复编译发布二进制：release 的 Docker 构建会完成一次真实编译。

  frontend:
    name: 前端（typecheck + vitest）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验（lint + format + typecheck + vitest）
        run: pnpm lint && pnpm format:test && pnpm typecheck && pnpm vitest
