name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（vet + 单元测试）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: 单元测试
        run: go test ./...

      - name: 编译检查
        run: go build -trimpath -ldflags "-s -w" -o /tmp/polaris ./cmd/polaris

  frontend:
    name: 前端（typecheck + vitest + build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验（typecheck + vitest + build）
        run: pnpm test

  docker:
    name: 容器镜像（构建 / 推送）
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 校验 Compose 配置
        env:
          POLARIS_JWT_SECRET: ci-placeholder-jwt-secret
          POLARIS_CREDENTIAL_ENC_KEY: ci-placeholder-credential-key
        run: docker compose config -q

      - name: 解析镜像仓库
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          repo="${DOCKERHUB_IMAGE:-}"
          if [ -z "$repo" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            repo="${DOCKERHUB_USERNAME}/polaris"
          fi
          if [ -z "$repo" ]; then
            # Pull Request（尤其来自 fork）拿不到 Secrets，只做构建验证。
            repo="local/polaris"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（main 分支多架构推送）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=polaris-ci
          cache-to: type=gha,mode=max,scope=polaris-ci
