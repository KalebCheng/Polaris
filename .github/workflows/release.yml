name: Release

# 打 tag（v*）或手动触发 → 构建多架构镜像并推送到 Docker Hub。
# 触发示例：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      push:
        description: 是否推送到 Docker Hub（不勾选则仅构建验证）
        type: boolean
        default: true
      tag:
        description: 手动发布时附加的镜像标签（例如 0.1.0-rc.1；留空则仅使用 sha）
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: 构建并推送多架构镜像
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解析镜像仓库
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          PUSH_ENABLED: ${{ github.event_name == 'push' || inputs.push }}
        run: |
          repo="${DOCKERHUB_IMAGE:-}"
          if [ -z "$repo" ]; then
            repo="${DOCKERHUB_USERNAME}/polaris"
          fi
          if [ -z "$repo" ] || [ "$repo" = "/polaris" ]; then
            if [ "$PUSH_ENABLED" = "true" ]; then
              echo "缺少 DOCKERHUB_USERNAME 或 DOCKERHUB_IMAGE，无法确定镜像仓库" >&2
              exit 1
            fi
            # 未推送的手动构建不需要仓库凭据。
            repo="local/polaris"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repo }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=polaris-release
          cache-to: type=gha,mode=max,scope=polaris-release
