name: Release

# 打任意 tag 或手动触发 → 构建多架构镜像并推送到 Docker Hub；
# 打 tag 时同时创建对应的 GitHub Release（预发布 tag 自动标记为 prerelease）。
# 触发示例：git tag 0.1.0 && git push origin 0.1.0
on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      push:
        description: 是否推送到 Docker Hub（不勾选则仅构建验证）
        type: boolean
        default: true
      tag:
        description: 手动发布时附加的镜像标签（例如 0.1.0-rc.1；留空则仅使用 sha）
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: 测试
    uses: ./.github/workflows/ci.yml

  docker:
    name: 构建并推送多架构镜像
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: 校验 Compose 配置
        env:
          POLARIS_DB_PASSWORD: ci-placeholder-db-password
          POLARIS_REDIS_PASSWORD: ci-placeholder-redis-password
          POLARIS_ADMIN_PASSWORD: ci-placeholder-admin-password
          POLARIS_JWT_SECRET: ci-placeholder-jwt-secret
          POLARIS_CREDENTIAL_ENC_KEY: ci-placeholder-credential-key
        run: docker compose config -q

      - name: 解析镜像仓库
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          PUSH_ENABLED: ${{ github.event_name == 'push' || inputs.push }}
        run: |
          repo="${DOCKERHUB_IMAGE:-}"
          if [ -z "$repo" ]; then
            repo="${DOCKERHUB_USERNAME}/polaris"
          fi
          if [ -z "$repo" ] || [ "$repo" = "/polaris" ]; then
            if [ "$PUSH_ENABLED" = "true" ]; then
              echo "缺少 DOCKERHUB_USERNAME 或 DOCKERHUB_IMAGE，无法确定镜像仓库" >&2
              exit 1
            fi
            # 未推送的手动构建不需要仓库凭据。
            repo="local/polaris"
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（多架构）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.repo }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=polaris-release
          cache-to: type=gha,mode=max,scope=polaris-release

  github-release:
    name: 创建 GitHub Release
    needs: docker
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 创建或确认 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG 已存在，跳过"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
