# Polaris 运行态 nginx 配置：托管 SPA + 反代后端 API/协议端点。
# 由运行镜像 docker/entrypoint.sh 与本文件共同构成单容器部署。

# 前置 TLS 代理会传入原始的 X-Forwarded-Proto；直连容器时回退到当前 scheme。
map $http_x_forwarded_proto $polaris_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream polaris_backend {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 上传体积（头像 ≤2MB，留出余量）
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端管理 API、OAuth/OIDC 协议端点、发现文档、本地存储直出
    # （SSO 回调中间页在前端命名空间 /sso/callback，由下面的 SPA 回退处理，
    #   因此 /oauth/* 整条前缀都是后端的，反代层不需要任何前缀例外）
    location ~ ^/(api/|oauth/|\.well-known/|static/|healthz$|readyz$) {
        proxy_pass http://polaris_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $polaris_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # SPA 路由回退：非静态资源一律交给 index.html（客户端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
