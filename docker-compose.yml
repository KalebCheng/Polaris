# Polaris 本地/单机部署：PostgreSQL + Redis + Polaris 应用镜像。
#
# 快速开始：
#   export POLARIS_JWT_SECRET=dev-secret-for-local-testing-only
#   export POLARIS_CREDENTIAL_ENC_KEY=$(openssl rand -base64 32)
#   docker compose up -d
#   访问 http://localhost:8100 （组织 built-in / admin / admin123）
#
# 说明：app 使用发布到 Docker Hub 的镜像；如需本地构建，见 README「用镜像部署」。
services:
  postgres:
    image: postgres:16-alpine
    container_name: polaris-postgres
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris123
      POSTGRES_DB: polaris
    ports:
      - "5432:5432"
    volumes:
      - polaris-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polaris"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: polaris-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${POLARIS_IMAGE:-polaris/polaris:latest}
    container_name: polaris-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POLARIS_ENV: production
      POLARIS_DB_HOST: postgres
      POLARIS_DB_PASSWORD: polaris123
      POLARIS_REDIS_HOST: redis
      # 以下两项必须注入（生产红线：禁止使用默认值）
      POLARIS_JWT_SECRET: ${POLARIS_JWT_SECRET:?必须设置 POLARIS_JWT_SECRET}
      POLARIS_CREDENTIAL_ENC_KEY: ${POLARIS_CREDENTIAL_ENC_KEY:?必须设置 POLARIS_CREDENTIAL_ENC_KEY}
      POLARIS_COOKIE_SECURE: "false"
      POLARIS_CSRF_ALLOWED_ORIGINS: "http://localhost:8100"
      POLARIS_DB_SEED: "true"
      # 生产请改为强口令或关闭种子
      POLARIS_ADMIN_PASSWORD: ${POLARIS_ADMIN_PASSWORD:-admin123}
    ports:
      - "8100:8100"
    restart: unless-stopped

volumes:
  polaris-pgdata:
